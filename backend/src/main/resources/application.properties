# ===================================================================
# Smart Book Bank Management System - Application Configuration
# NOTE: Never commit real secrets. Use environment variables in production.
# Defaults below are for local development only.
# ===================================================================

spring.application.name=book-bank-management-system

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- MySQL Datasource ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookbank_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Priya@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update = keeps your data, auto-creates/alters tables to match entities (good for dev)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# jwt.secret MUST be a long, random, base64-safe string in production (set via env var)
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyPleaseChangeItInProduction123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Business Rules (configurable, not hardcoded) ----------
bookbank.borrow.period-days=${BORROW_PERIOD_DAYS:14}
bookbank.fine.per-day=${FINE_PER_DAY:5}
bookbank.reservation.expiry-days=${RESERVATION_EXPIRY_DAYS:3}
bookbank.borrow.max-books-per-student=${MAX_BOOKS_PER_STUDENT:3}

# ---------- Email / SMTP ----------
# Configure for your environment. For local dev, use a test server like MailHog (port 1025) or Ethereal.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset token validity (minutes)
bookbank.reset-token.validity-minutes=${RESET_TOKEN_VALIDITY_MINUTES:15}
bookbank.reset-token.max-attempts=${RESET_TOKEN_MAX_ATTEMPTS:5}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging ----------
logging.level.com.bookbank=DEBUG
logging.level.org.springframework.security=INFO
